<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>detalhe da tarefa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f25551cbab6b194e9c1439682cdfeafb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<div class="scroll">
<div style="height:248px;position:relative;border-bottom:1px solid var(--border)">
<img src="{{t.img}}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
<a class="iconbtn" href="{{L.Main}}" data-to="Main" aria-label="Voltar" style="position:absolute;left:8px;top:8px;background:var(--surface);color:var(--text);border:1px solid var(--border)"><span class="ic i-chev-l"></span></a>
<sc-if value="{{canEdit}}" hint-placeholder-val="{{false}}"><a class="iconbtn" href="{{L.NovaTarefa}}" data-to="NovaTarefa" aria-label="Editar tarefa" style="position:absolute;right:8px;top:8px;background:var(--surface);color:var(--text);border:1px solid var(--border)"><span class="ic i-editar"></span></a></sc-if>
<span style="position:absolute;left:16px;bottom:-15px;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border)"><span class="ic ic-xs {{t.icon}}"></span><span class="label" style="font-size:12px">{{t.cat}}</span></span>
</div>

<div style="padding:32px 16px 24px">
<span class="st {{st.cls}}"><span class="ic {{st.icon}}"></span>{{st.txt}}</span>
<h1 class="h3" style="margin-top:12px">{{t.title}}</h1>
<p class="txt muted" style="margin-top:12px">{{t.desc}}</p>

<dl style="margin:24px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--border)">
<div style="padding:16px 12px 16px 0;border-bottom:1px solid var(--border);border-right:1px solid var(--border)"><dt class="label muted">pontos</dt><dd style="margin:8px 0 0;display:flex;align-items:center;gap:8px"><span class="pb" style="font-size:20px">{{ptsShown}}<small>pts</small></span><sc-if value="{{half}}" hint-placeholder-val="{{false}}"><span class="small muted" style="text-decoration:line-through">{{t.pts}}</span></sc-if></dd></div>
<div style="padding:16px 0 16px 16px;border-bottom:1px solid var(--border)"><dt class="label muted">prazo</dt><dd style="margin:8px 0 0"><span class="txt" style="font-weight:600;display:block">{{t.dueAbs}}</span><span class="small" style="color:{{dueColor}};font-weight:600">{{t.dueRel}}</span></dd></div>
<div style="padding:16px 12px 16px 0;border-bottom:1px solid var(--border);border-right:1px solid var(--border)"><dt class="label muted">dono</dt><dd style="margin:8px 0 0;display:flex;align-items:center;gap:8px"><span class="av" style="width:24px;height:24px;border:1px dashed {{ownerBorder}}"><img src="{{t.ownerAv}}" alt="" style="opacity:{{ownerOp}}"></span><span class="txt" style="font-weight:600">{{t.owner}}</span></dd></div>
<div style="padding:16px 0 16px 16px;border-bottom:1px solid var(--border)"><dt class="label muted">como</dt><dd class="txt" style="margin:8px 0 0;font-weight:600">{{t.via}}</dd></div>
</dl>
<p class="small muted" style="margin-top:12px;display:flex;align-items:center;gap:8px"><span class="av" style="width:24px;height:24px"><img src="{{t.byAv}}" alt=""></span>criada por {{t.by}} · {{t.when}}</p>

<sc-if value="{{note}}" hint-placeholder-val="{{false}}">
<p class="small" style="margin-top:20px;background:{{noteBg}};color:{{noteFg}};border-radius:4px;padding:12px;display:flex;gap:8px;font-weight:600"><span class="ic ic-s {{noteIcon}}" style="margin-top:4px"></span>{{noteTxt}}</p>
</sc-if>
</div>
</div>

<sc-if value="{{hasActions}}" hint-placeholder-val="{{true}}">
<div style="flex:none;padding:12px 16px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--background)">
<sc-if value="{{aDevolver}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-o" onClick="{{askReturn}}"><span class="ic i-devolver"></span>Devolver</button></sc-if>
<sc-if value="{{aConcluir}}" hint-placeholder-val="{{true}}"><a class="btn btn-p" href="{{L.Concluida}}" data-to="Concluida" style="flex:1"><span class="ic i-check"></span>Concluir</a></sc-if>
<sc-if value="{{aAssumir}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-a" style="flex:1" onClick="{{take}}"><span class="ic i-check"></span>{{assumirLabel}}</button></sc-if>
<sc-if value="{{aCancelar}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-d" style="flex:1" onClick="{{askCancel}}"><span class="ic i-x"></span>Cancelar tarefa</button></sc-if>
</div>
</sc-if>

<sc-if value="{{snack}}" hint-placeholder-val="{{false}}">
<div class="snack" role="status" style="bottom:88px"><span class="ic ic-s i-check" style="color:var(--lima)"></span><span style="flex:1;font-weight:600;font-size:14px">{{snackTxt}}</span><button class="act" type="button" onClick="{{undoSnack}}">Desfazer</button><span class="bar"></span></div>
</sc-if>

<sc-if value="{{dlg}}" hint-placeholder-val="{{false}}">
<div class="scrim" style="justify-content:center">
<div class="dialog" role="alertdialog" aria-labelledby="d-t">
<p class="h3" id="d-t" style="font-size:28px">{{dlgTitle}}</p>
<p class="small muted" style="margin-top:8px">{{dlgBody}}</p>
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
<button type="button" class="btn btn-t" onClick="{{closeDlg}}">Voltar</button>
<button type="button" class="btn {{dlgCls}}" onClick="{{confirm}}">{{dlgOk}}</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>

</body>
</html>
