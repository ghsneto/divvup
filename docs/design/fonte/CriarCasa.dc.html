<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>criar casa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f25551cbab6b194e9c1439682cdfeafb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<header style="display:flex;align-items:center;gap:12px;padding:12px 16px 0 8px;flex:none">
<a class="iconbtn" href="{{L.OnbCasa}}" data-to="OnbCasa" aria-label="Voltar"><span class="ic i-chev-l"></span></a>
<div style="display:flex;gap:4px;flex:1" aria-label="Passo 3 de 5"><span style="flex:1;height:4px;border-radius:4px;background:var(--text)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--text)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--primary)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span></div>
<span class="small muted tnum">3/5</span>
</header>

<div class="scroll" style="padding:20px 16px 16px">
<h1 class="h1" style="font-size:57px">batiza a casa</h1>

<div class="field {{shake}}" style="margin-top:24px">
<label class="label" for="h-nome">nome da casa</label>
<input id="h-nome" class="in {{nomeErr}}" value="{{nome}}" onChange="{{setNome}}" placeholder="Ex.: Rep. Cajueiro" maxlength="32" style="font-size:20px;font-weight:600;height:56px">
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p class="errmsg"><span class="ic i-alerta"></span>Dá um nome pra casa.</p></sc-if>
</div>

<fieldset style="border:0;padding:0;margin:24px 0 0">
<legend class="label" style="margin-bottom:8px">tipo</legend>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{tipos}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border-radius:12px;border:{{t.bw}} solid {{t.bc}};background:{{t.bg}};cursor:pointer;min-height:64px">
<span class="ic {{t.icon}}" style="color:{{t.ic}}"></span>
<span style="flex:1"><span style="display:block;font-size:16px;font-weight:600;color:var(--text)">{{t.name}}</span><span class="small muted">{{t.desc}}</span></span>
<span style="width:22px;height:22px;border-radius:999px;border:1px solid {{t.bc}};display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:999px;background:{{t.dot}}"></span></span>
</button>
</sc-for>
</div>
</fieldset>

<sc-if value="{{rep}}" hint-placeholder-val="{{true}}">
<div class="a-up" style="margin-top:16px;background:var(--surface-alt);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start">
<button type="button" class="tg {{adOn}}" role="switch" aria-checked="{{adChecked}}" aria-label="Anunciar vagas" onClick="{{toggleAd}}"></button>
<div style="flex:1"><p style="margin:0;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center">Anunciar vagas <span class="st st-p" style="height:18px;font-size:12px">v1.1</span></p><p class="small muted" style="margin-top:4px">A casa aparece na busca depois que você preencher vagas e endereço. O número da casa nunca é público.</p></div>
</div>
</sc-if>
</div>

<div style="flex:none;padding:12px 16px 20px;border-top:1px solid var(--border)">
<button type="button" class="btn btn-p btn-w" onClick="{{create}}">Criar casa</button>
</div>
<sc-if value="{{go}}" hint-placeholder-val="{{false}}">
<div class="scrim" style="justify-content:center;background:var(--background)"><div style="padding:0 24px" class="a-pop"><span class="label muted">pronto</span><p class="h1" style="font-size:57px">{{nomeLower}} existe</p><a class="btn btn-p" style="margin-top:20px" href="{{L.Tutorial}}" data-to="Tutorial">Bora aprender o swipe<span class="ic i-seta-r"></span></a></div></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"setTema":{"editor":null},"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":360,"height":800}}'>
var TIPOS = [['República', 'i-usuarios', 'Estudantes dividindo a casa'], ['Moradia compartilhada', 'i-casa', 'Quem divide apê ou casa'], ['Casal/Família', 'i-perfil', 'Casa de casal ou família']];
var __GO = false;
var __T = ['OnbCasa', 'Tutorial'];
function __L() { var o = {}; __T.forEach(function (n) { o[n] = __GO ? undefined : n + '.dc.html'; }); return o; }
function __u(n) { return { h: n ? (__GO ? undefined : n + '.dc.html') : (__GO ? undefined : '#'), t: n }; }
function __N(p) { return function (e) { if (!p.go) return; var el = e.target && e.target.closest ? e.target.closest('[data-to]') : null; if (!el) return; var t = el.getAttribute('data-to'); if (!t) return; e.preventDefault(); p.go(t); }; }
class Component extends DCLogic {
  renderVals() { __GO = !!this.props.go;
    var self = this, s = Object.assign({ nome: 'Rep. Cajueiro', tipo: 0, ad: true, tried: false, go: false }, this.state || {});
    var empty = s.tried && !s.nome.trim();
    return { L: __L(), __nav: __N(this.props), 
      temaCls: this.props.tema === 'escuro' ? 'escuro' : '',
      nome: s.nome, nomeLower: s.nome.toLowerCase(), setNome: function (e) { self.setState({ nome: e.target.value }); },
      empty: empty, nomeErr: empty ? 'err' : '', shake: empty ? 'a-shake' : '',
      tipos: TIPOS.map(function (t, i) { var on = i === s.tipo; return { name: t[0], icon: t[1], desc: t[2], pressed: on ? 'true' : 'false', bw: on ? '1px' : '1px', bc: on ? 'var(--primary)' : 'var(--border)', bg: on ? 'var(--primary-bg)' : 'var(--surface)', ic: on ? 'var(--primary)' : 'var(--text)', dot: on ? 'var(--primary)' : 'transparent', pick: function () { self.setState({ tipo: i, ad: i === 0 }); } }; }),
      rep: s.tipo === 0, adOn: s.ad ? 'on' : '', adChecked: s.ad ? 'true' : 'false', toggleAd: function () { self.setState({ ad: !s.ad }); },
      create: function () { if (!s.nome.trim()) { self.setState({ tried: true }); return; } self.setState({ go: true }); },
      go: s.go
    };
  }
}
</script>
</body>
</html>
