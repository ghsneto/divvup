<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>galeria de avatar</title>
<script src="./support.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<header class="topbar" style="padding-left:8px"><a class="iconbtn" href="{{L.EditarPerfil}}" data-to="EditarPerfil" aria-label="Voltar"><span class="ic i-chev-l"></span></a><span class="label muted">avatar</span></header>
<div class="scroll" style="padding:0 16px 16px">
<div style="display:flex;align-items:flex-end;gap:16px">
<h1 class="h2" style="flex:1">escolhe sua cara</h1>
<span class="av {{popCls}}" style="width:96px;height:96px;border:1px solid var(--lima)"><img src="{{sel}}" alt="Avatar escolhido"></span>
</div>
<p class="small muted" style="margin-top:8px">{{count}} avatares, todos liberados. O editor completo vem depois.</p>

<div role="radiogroup" aria-label="Avatares" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:20px">
<sc-for list="{{avs}}" as="a" hint-placeholder-count="24"><button type="button" role="radio" aria-checked="{{a.checked}}" aria-label="Avatar {{a.n}}" onClick="{{a.pick}}" style="aspect-ratio:1;padding:0;border-radius:999px;overflow:hidden;cursor:pointer;border:1px solid {{a.ring}};background:transparent;transform:scale({{a.sc}});transition:transform .15s"><img src="{{a.src}}" alt="" style="width:100%;height:100%;display:block"></button></sc-for>
</div>

<div style="display:flex;gap:8px;margin-top:20px">
<button type="button" onClick="{{foto}}" class="btn btn-o" style="flex:1"><span class="ic i-camera"></span>Usar uma foto</button>
<button type="button" onClick="{{semFoto}}" class="btn btn-t" style="color:var(--danger)">Remover foto</button>
</div>
</div>
<div style="flex:none;padding:12px 16px 20px;border-top:1px solid var(--border)"><a class="btn btn-p btn-w" href="{{L.Perfil}}" data-to="Perfil">Salvar</a></div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="snack" role="status" style="bottom:{{toastBottom}}px"><span class="ic ic-s i-info" style="color:#c9f24d"></span><span style="flex:1;font-weight:600;font-size:14px">{{toast}}</span></div></sc-if>
</div>
</x-dc>
