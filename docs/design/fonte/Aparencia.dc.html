<html lang="pt-BR">

<style>body{margin:0}</style>

<header class="topbar" style="padding-left:8px"><a class="iconbtn" href="{{L.Perfil}}" data-to="Perfil" aria-label="Voltar"><span class="ic i-chev-l"></span></a><span class="label muted">perfil</span></header>
<div style="padding:0 16px">
<h1 class="h1" style="font-size:57px">aparência</h1>
<p class="small muted" style="margin-top:8px">Toca pra ver a tela mudar na hora.</p>
<div role="radiogroup" aria-label="Tema" style="display:flex;flex-direction:column;gap:8px;margin-top:24px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display:flex;align-items:center;gap:16px;padding:12px;border-radius:12px;border:{{o.bw}} solid {{o.bc}};background:var(--surface);cursor:pointer;text-align:left;color:var(--text)">
<span style="width:64px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--border);display:flex;flex:none" aria-hidden="true">
<span style="flex:1;background:{{o.a}};display:flex;flex-direction:column;gap:4px;padding:8px 8px"><span style="height:6px;width:70%;background:{{o.ta}};border-radius:4px"></span><span style="height:24px;background:#2f2bd9;border-radius:4px"></span><span style="height:6px;width:40%;background:var(--lima);border-radius:4px"></span></span>
<span style="flex:{{o.split}};background:{{o.b}};display:flex;flex-direction:column;gap:4px;padding:8px 0"><span style="height:6px;width:70%;background:{{o.tb}};border-radius:4px"></span><span style="height:24px;background:#7590fd;border-radius:4px 0 0 4px"></span></span>
</span>
<span style="flex:1"><span style="display:block;font-size:16px;font-weight:600">{{o.name}}</span><span class="small muted">{{o.desc}}</span></span>
<span style="width:24px;height:24px;border-radius:999px;border:1px solid {{o.bc}};display:flex;align-items:center;justify-content:center"><span style="width:12px;height:12px;border-radius:999px;background:{{o.dot}}"></span></span>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
