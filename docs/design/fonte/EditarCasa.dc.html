<div class="scroll" style="padding:0 16px 16px">
<h1 class="h1" style="font-size:57px">editar casa</h1>
<div class="field" style="margin-top:24px"><label class="label" for="g-nome">nome</label><input id="g-nome" class="in" value="Rep. Cajueiro" style="font-size:16px;font-weight:600"></div>
<fieldset style="border:0;padding:0;margin:20px 0 0"><legend class="label" style="margin-bottom:8px">tipo</legend>
<div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{tipos}}" as="t" hint-placeholder-count="3"><button type="button" class="chip {{t.on}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}"><span class="ic ic-s {{t.icon}}"></span>{{t.name}}</button></sc-for></div>
<sc-if value="{{warn}}" hint-placeholder-val="{{false}}"><p class="small a-up" style="margin-top:12px;background:var(--warning-bg);color:var(--warning);padding:12px 12px;border-radius:4px;display:flex;gap:8px;font-weight:600"><span class="ic ic-s i-alerta"></span>Casal/Família não aparece na busca. Ao salvar, o anúncio de vagas será desligado.</p></sc-if>
</fieldset>
<h2 class="label" style="margin:24px 0 8px">onde fica</h2>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">
<div class="field"><label class="small muted" for="g-cid">Cidade</label><input id="g-cid" class="in" value="Recife"></div>
<div class="field"><label class="small muted" for="g-bai">Bairro</label><input id="g-bai" class="in" value="Várzea"></div>
<div class="field" style="grid-column:span 2"><label class="small muted" for="g-rua">Rua</label><input id="g-rua" class="in" value="Rua Amaro Albino Pimentel"></div>
</div>
<p class="small muted" style="margin-top:8px;display:flex;gap:8px"><span class="ic ic-s i-cadeado"></span>Só os moradores veem isso. O número fica no anúncio, e só para quem você aprovar.</p>
</div>
<div style="flex:none;padding:12px 16px 20px;border-top:1px solid var(--border)"><a class="btn btn-p btn-w" href="{{L.MinhaCasa}}" data-to="MinhaCasa">Salvar</a></div>
</div>
</x-dc>

</body>
</html>
