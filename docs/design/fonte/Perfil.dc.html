<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>perfil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f25551cbab6b194e9c1439682cdfeafb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<div class="scroll" style="padding:0 16px 24px">
<div style="display:flex;justify-content:flex-end;padding-top:8px"><a class="btn btn-o" href="{{L.EditarPerfil}}" data-to="EditarPerfil" style="min-height:40px;padding:8px 16px"><span class="ic ic-s i-editar"></span>Editar</a></div>
<div style="display:flex;align-items:flex-end;gap:16px;margin-top:4px">
<span class="av" style="width:96px;height:96px;border:1px solid var(--lima)"><img src="/_blob/e00900d46e0a7e6fc26a8968881f87ba" alt=""></span>
<div style="min-width:0;padding-bottom:8px"><h1 class="h1" style="font-size:57px">iane</h1><p class="small muted">iane@email.com</p></div>
</div>

<div style="margin-top:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
<div style="padding:16px;border-right:1px solid var(--border);grid-row:span 2;display:flex;flex-direction:column">
<span class="label muted">sequência</span>
<div style="display:flex;align-items:baseline;gap:4px;margin-top:4px"><span class="tnum" style="font-size:57px;font-weight:800;line-height:1.05;font-variation-settings:'opsz' 96,'wdth' 90">4</span><span class="small muted">dias</span></div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:auto" aria-label="Últimos 14 dias">
<sc-for list="{{days}}" as="d" hint-placeholder-count="14"><span style="aspect-ratio:1;border-radius:4px;background:{{d.bg}};border:1px solid {{d.bd}}"></span></sc-for>
</div>
<span class="small muted" style="font-size:12px;margin-top:8px">recorde: 12 dias</span>
</div>
<div style="padding:12px 16px;border-bottom:1px solid var(--border)"><span class="label muted">mês</span><p class="pts" style="margin:4px 0 0">325 pts</p></div>
<div style="padding:12px 16px"><span class="label muted">total</span><p class="pts" style="margin:4px 0 0">2.115 pts</p><span class="small muted">52 tarefas</span></div>
</div>

<h2 class="label" style="margin:28px 0 12px;display:flex;justify-content:space-between">medalhas<span class="muted tnum">3 de 5</span></h2>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px">
<sc-for list="{{medals}}" as="m" hint-placeholder-count="5">
<button type="button" onClick="{{m.pick}}" aria-label="{{m.name}}, {{m.state}}" style="grid-column:{{m.col}};display:flex;flex-direction:{{m.dir}};align-items:{{m.align}};gap:12px;padding:12px;border-radius:12px;border:1px {{m.bs}} {{m.bc}};background:{{m.bg}};color:{{m.fg}};cursor:pointer;text-align:left;min-height:96px">
<span style="width:{{m.sz}}px;height:{{m.sz}}px;border-radius:999px;background:{{m.disc}};color:{{m.discFg}};display:flex;align-items:center;justify-content:center;flex:none"><span class="ic {{m.icon}}"></span></span>
<span style="min-width:0"><span style="display:block;font-weight:600;font-size:{{m.fs}}px;line-height:1.15">{{m.name}}</span><span style="font-size:12px;">{{m.sub}}</span></span>
</button>
</sc-for>
</div>
<sc-if value="{{tip}}" hint-placeholder-val="{{false}}"><p class="small a-up" style="margin-top:8px;background:var(--surface-alt);border-radius:4px;padding:12px 12px;display:flex;gap:8px"><span class="ic ic-s i-cadeado"></span><span><b>{{tipName}}:</b> {{tip}}</span></p></sc-if>

<nav style="margin-top:28px;border-top:1px solid var(--border)" aria-label="Configurações">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5"><a href="{{l.href.h}}" data-to="{{l.href.t}}" style="display:flex;align-items:center;gap:16px;min-height:56px;border-bottom:1px solid var(--border);text-decoration:none;color:{{l.color}}"><span class="ic {{l.icon}}"></span><span style="flex:1;font-size:16px;font-weight:600">{{l.name}}</span><span class="small muted">{{l.meta}}</span><span class="ic ic-s i-chev-r muted"></span></a></sc-for>
<button type="button" onClick="{{askOut}}" style="width:100%;display:flex;align-items:center;gap:16px;min-height:56px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text);padding:0"><span class="ic i-sair"></span><span style="flex:1;font-size:16px;font-weight:600;text-align:left">Sair da conta</span></button>
<a href="{{L.ExcluirConta}}" data-to="ExcluirConta" style="display:flex;align-items:center;gap:16px;min-height:56px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--danger)"><span class="ic i-lixo"></span><span style="flex:1;font-size:16px;font-weight:600">Excluir conta</span><span class="ic ic-s i-chev-r"></span></a>
</nav>
</div>

<sc-if value="{{out}}" hint-placeholder-val="{{false}}"><div class="scrim" style="justify-content:center"><div class="dialog" role="alertdialog" aria-labelledby="o-t"><p class="h3" id="o-t" style="font-size:28px">Sair da conta?</p><p class="small muted" style="margin-top:8px">Você continua na Rep. Cajueiro. É só entrar de novo.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" class="btn btn-t" onClick="{{closeOut}}">Cancelar</button><a class="btn btn-p" href="{{L.BoasVindas}}" data-to="BoasVindas">Sair da conta</a></div></div></div></sc-if>
<nav class="tabbar" aria-label="Navegação principal">
<a class="tab" href="{{L.Main}}" data-to="Main"><span class="ic i-deck"></span>Deck</a>
<a class="tab" href="{{L.MinhasTarefas}}" data-to="MinhasTarefas"><span class="ic i-tarefas"></span>Minhas tarefas</a>
<a class="tab" href="{{L.Ranking}}" data-to="Ranking"><span class="ic i-ranking"></span>Ranking</a>
<a class="tab on" href="{{L.Perfil}}" data-to="Perfil" aria-current="page"><span class="ic i-perfil"></span>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"setTema":{"editor":null},"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":360,"height":800}}'>
var MED = [
  ['campeã do mês', 'i-trofeu', true, 'outubro', 'Feche um mês em 1º lugar.'],
  ['sequência de 7 dias', 'i-raio', true, 'set.', '7 dias seguidos concluindo ao menos uma tarefa.'],
  ['primeira tarefa', 'i-check', true, 'mar.', 'Conclua sua primeira tarefa.'],
  ['salva-vidas', 'i-relogio', false, 'bloqueada', 'Assuma uma tarefa a menos de 48 h do prazo.'],
  ['100 tarefas', 'i-medalha', false, '52 de 100', 'Conclua 100 tarefas no total.']
];
var __GO = false;
var __T = ['Aparencia', 'BoasVindas', 'EditarPerfil', 'ExcluirConta', 'Main', 'MinhaCasa', 'MinhasTarefas', 'Perfil', 'PrefsNotif', 'Ranking', 'Sobre'];
function __L() { var o = {}; __T.forEach(function (n) { o[n] = __GO ? undefined : n + '.dc.html'; }); return o; }
function __u(n) { return { h: n ? (__GO ? undefined : n + '.dc.html') : (__GO ? undefined : '#'), t: n }; }
function __N(p) { return function (e) { if (!p.go) return; var el = e.target && e.target.closest ? e.target.closest('[data-to]') : null; if (!el) return; var t = el.getAttribute('data-to'); if (!t) return; e.preventDefault(); p.go(t); }; }
class Component extends DCLogic {
  renderVals() { __GO = !!this.props.go;
    var self = this, s = this.state || {};
    var days = [];
    var pat = [1, 1, 0, 1, 1, 1, 0, 0, 1, 0, 1, 1, 1, 1];
    for (var i = 0; i < 14; i++) days.push({ bg: pat[i] ? (i >= 10 ? 'var(--accent)' : 'var(--text-muted)') : 'transparent', bd: pat[i] ? 'transparent' : 'var(--border)' });
    var medals = MED.map(function (m, i) {
      var big = i === 0, on = m[2];
      return { name: m[0], icon: m[1], sub: m[3], state: on ? 'conquistada' : 'bloqueada',
        col: big ? 'span 2' : 'span 1', dir: big ? 'row' : 'column', align: big ? 'center' : 'flex-start', sz: big ? 56 : 36, fs: big ? 16 : 14,
        bg: big ? 'var(--ultramarino)' : (on ? 'var(--surface)' : 'transparent'), fg: big ? '#ffffff' : (on ? 'var(--text)' : 'var(--text-muted)'),
        bs: on ? 'solid' : 'dashed', bc: big ? 'var(--ultramarino)' : 'var(--border)',
        disc: on ? 'var(--lima)' : 'var(--surface-alt)', discFg: on ? 'var(--tinta)' : 'var(--text-muted)',
        pick: function () { self.setState({ tip: on ? null : i }); } };
    });
    var tip = s.tip != null ? MED[s.tip] : null;
    return { L: __L(), __nav: __N(this.props), 
      temaCls: this.props.tema === 'escuro' ? 'escuro' : '',
      out: !!s.out, askOut: function () { self.setState({ out: true }); }, closeOut: function () { self.setState({ out: false }); },
      days: days, medals: medals, tip: tip ? tip[4] : '', tipName: tip ? tip[0] : '',
      links: [
        { name: 'Minha casa', icon: 'i-casa', href: __u('MinhaCasa'), meta: 'Rep. Cajueiro', color: 'var(--text)' },
        { name: 'Notificações', icon: 'i-sino', href: __u('PrefsNotif'), meta: '', color: 'var(--text)' },
        { name: 'Aparência', icon: 'i-sol', href: __u('Aparencia'), meta: 'sistema', color: 'var(--text)' },
        { name: 'Sobre o Divvup', icon: 'i-info', href: __u('Sobre'), meta: '', color: 'var(--text)' }
      ]
    };
  }
}
</script>
</body>
</html>
