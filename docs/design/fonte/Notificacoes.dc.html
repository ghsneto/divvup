<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>central de notificações</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f25551cbab6b194e9c1439682cdfeafb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<header class="topbar" style="padding-left:8px"><a class="iconbtn" href="{{L.Main}}" data-to="Main" aria-label="Voltar"><span class="ic i-chev-l"></span></a><span style="flex:1"></span>
<sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><button type="button" class="btn btn-t" onClick="{{readAll}}" style="min-height:44px"><span class="ic ic-s i-check"></span>Marcar todas como lidas</button></sc-if>
</header>
<div class="scroll" style="padding:0 16px 24px">
<div style="display:flex;align-items:baseline;gap:12px"><h1 class="h1" style="font-size:57px">avisos</h1><sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><span class="pb tnum" style="font-size:16px">{{unread}} novas</span></sc-if></div>
<p class="small muted" style="margin-top:4px">Últimos 30 dias.</p>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding:64px 0 0"><span class="ic ic-l i-sino muted"></span><p class="h2" style="font-size:36px;margin-top:12px">nenhuma notificação por aqui</p><p class="txt muted" style="margin-top:8px">Quando algo acontecer na casa, aparece aqui.</p></div>
</sc-if>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 class="label muted" style="margin:24px 0 4px">{{g.name}}</h2>
<ul style="list-style:none;margin:0;padding:0">
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<li style="border-bottom:1px solid var(--border)">
<a href="{{n.href.h}}" data-to="{{n.href.t}}" onClick="{{n.read}}" style="display:flex;gap:12px;padding:12px 0;text-decoration:none;color:var(--text);align-items:flex-start">
<span style="width:40px;height:40px;border-radius:12px;background:{{n.bg}};color:{{n.fg}};display:flex;align-items:center;justify-content:center;flex:none"><span class="ic ic-s {{n.icon}}"></span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:{{n.w}}">{{n.title}}</span><span class="small muted" style="display:block">{{n.body}}</span><span class="small muted" style="font-size:12px">{{n.when}}</span></span>
<span style="width:10px;height:10px;border-radius:999px;background:{{n.dot}};margin-top:8px;flex:none" aria-label="{{n.dotLabel}}"></span>
</a>
</li>
</sc-for>
</ul>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"setTema":{"editor":null},"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"vazio":{"editor":"boolean","default":false},"$preview":{"width":360,"height":800}}'>

    ['b', 'Lavar a louça vence em 2 h', 'Às 22h. Bora?', 'há 3 h', 'i-relogio', 'var(--warning-bg)', 'var(--warning)', 'DetalheTarefa', 1],
    ['c', 'Bruno criou Passear com o Thor', 'Pets · 50 pts', 'há 5 h', 'i-mais', 'var(--surface-alt)', 'var(--text)', 'DetalheAberta', 1]

</body>
</html>
