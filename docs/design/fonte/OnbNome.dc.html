<x-dc>
<helmet>

<style>body{margin:0}</style>

<div onClick="{{__nav}}" class="dv phone {{temaCls}}">
<header style="display:flex;align-items:center;gap:12px;padding:20px 16px 0;flex:none">
<div style="display:flex;gap:4px;flex:1" aria-label="Passo 1 de 5"><span style="flex:1;height:4px;border-radius:4px;background:var(--primary)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span><span style="flex:1;height:4px;border-radius:4px;background:var(--border)"></span></div>
<span class="small muted tnum">1/5</span>
</header>

<div style="padding:28px 16px 0;flex:1;display:flex;flex-direction:column">
<h1 class="h1" style="font-size:57px;max-width:250px">como te chamam?</h1>

<div style="display:flex;align-items:flex-end;gap:16px;margin-top:24px">
<div style="position:relative;flex:none">
<span class="av a-pop" style="width:96px;height:96px;border:1px solid var(--accent)"><img src="{{avatar}}" alt="Seu avatar"></span>
<a href="{{L.Avatar}}" data-to="Avatar" class="iconbtn" aria-label="Escolher avatar" style="position:absolute;right:-4px;bottom:-4px;background:var(--primary);color:var(--on-primary);border-radius:999px"><span class="ic i-editar"></span></a>
</div>
<div style="display:flex;flex-direction:column;gap:8px;padding-bottom:4px">
<span class="label muted">escolha rápida</span>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="6"><button type="button" onClick="{{q.pick}}" aria-label="Avatar {{q.n}}" aria-pressed="{{q.pressed}}" style="width:44px;height:44px;padding:0;border-radius:999px;border:1px solid {{q.ring}};overflow:hidden;cursor:pointer;background:transparent"><img src="{{q.src}}" alt="" style="width:100%;height:100%;display:block"></button></sc-for>
</div>
</div>
</div>
<div style="display:flex;gap:16px;margin-top:12px"><a href="{{L.Avatar}}" data-to="Avatar" class="small" style="font-weight:600">Ver todos os avatares</a><a href="{{L.Avatar}}" data-to="Avatar" class="small" style="font-weight:600;display:flex;gap:4px;align-items:center"><span class="ic ic-xs i-camera"></span>Usar foto</a></div>

<div class="field" style="margin-top:28px"><label class="label" for="n-nome">nome de exibição</label><input id="n-nome" class="in" value="{{nome}}" onChange="{{setNome}}" maxlength="24"><span class="small muted">É assim que a casa vai te ver no ranking.</span></div>

<a class="btn btn-p btn-w {{off}}" href="{{L.OnbCasa}}" data-to="OnbCasa" style="margin:auto 0 24px">Continuar<span class="ic i-seta-r"></span></a>
</div>
</div>
</x-dc>

</body>
</html>
