<sc-if value="{{form}}" hint-placeholder-val="{{true}}">
<div style="padding:0 16px;flex:1;display:flex;flex-direction:column">
<h1 class="h1" style="font-size:57px">o que tá errado?</h1>
<p class="small muted" style="margin-top:8px">A denúncia é anônima para a casa.</p>
<div role="radiogroup" aria-label="Motivo" style="margin-top:20px;border-top:1px solid var(--border)">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="width:100%;display:flex;align-items:center;gap:12px;min-height:60px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;text-align:left;color:var(--text);padding:0">
<span style="width:22px;height:22px;border-radius:999px;border:1px solid {{o.bc}};display:flex;align-items:center;justify-content:center;flex:none"><span style="width:10px;height:10px;border-radius:999px;background:{{o.dot}}"></span></span>
<span style="flex:1"><span style="display:block;font-weight:600">{{o.name}}</span><span class="small muted">{{o.desc}}</span></span>
</button>
</sc-for>
</div>
<sc-if value="{{other}}" hint-placeholder-val="{{false}}"><textarea class="in a-up" rows="3" aria-label="Conte o que aconteceu" placeholder="Conte o que aconteceu" style="height:auto;padding:12px;margin-top:12px;resize:none"></textarea></sc-if>
<button type="button" class="btn btn-dd btn-w {{off}}" style="margin:auto 0 24px" onClick="{{send}}"><span class="ic i-bandeira"></span>Enviar denúncia</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div class="a-up" style="padding:24px 16px 0;flex:1;display:flex;flex-direction:column"><span class="label muted">recebido</span><p class="h1" style="font-size:57px;margin-top:8px">valeu por avisar</p><p class="txt muted" style="margin-top:12px">A gente revisa em até 48 h. Se for golpe, a casa sai da busca.</p><a class="btn btn-p" href="{{L.Buscar}}" data-to="Buscar" style="margin:auto 0 24px">Voltar para a busca</a></div>
</sc-if>
</div>
</x-dc>

</body>
</html>
