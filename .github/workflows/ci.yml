name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `check` = lint (aviso vira erro) + testes unitários (dev e prod) + guardas
      # (:core:domain puro, sem literais de design). `verifyRoborazziDebug` compara os
      # screenshots com as imagens aprovadas em src/test/screenshots.
      - name: Build e verificação
        run: ./gradlew check verifyRoborazziDebug assembleDevDebug assembleProdDebug --stacktrace

      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 7

  backend:
    name: Backend e Security Rules (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # O Firestore Emulator roda na JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Lint e tipos
        run: npm run lint

      # Projeto fictício demo-divvup: nunca toca divvup-prod (ADR 0002).
      - name: Testes contra o Firebase Emulator
        run: npm run test:emulador

