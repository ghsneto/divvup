name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `check` = lint (aviso vira erro) + testes unitários (dev e prod) + guardas
      # (:core:domain puro, sem literais de design). `verifyRoborazziDebug` compara os
      # screenshots com as imagens aprovadas em src/test/screenshots.
      - name: Build e verificação
        run: ./gradlew check verifyRoborazziDebug assembleDevDebug assembleProdDebug --stacktrace

      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 7
